<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 1.5 13.6 4.75v6.5L8 14.5 2.4 11.25v-6.5Z' fill='%231a5fd0'/%3E%3Ccircle cx='8' cy='8' r='2.3' fill='%23fff'/%3E%3C/svg%3E" />
    <title>Page not found · Chromium Open Source Health</title>
    <link rel="stylesheet" href="/src/home.css" />
  </head>
  <body>
    <!--
      Shown for any URL the site doesn't have: GitHub Pages serves a root
      404.html by itself, and `vite preview` does through the cosh-404 plugin
      in vite.config.ts. Its links and stylesheet are relative (base './'), so
      at a made-up path in a subdirectory it shows unstyled; top-level
      mistakes, the usual kind, look like the landing page.
    -->
    <main class="not-found">
      <p class="subtitle">Page not found</p>
      <h1>There's no page here</h1>
      <p class="lede">
        The link may be mistyped, or the page may have moved. The landing page lists every dashboard.
      </p>
      <p><a href="index.html">Go to the landing page</a></p>
    </main>
  </body>
</html>
